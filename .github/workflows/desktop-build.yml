name: Desktop build candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-15
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: corepack pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: corepack pnpm build:sidecar
      - name: Verify standalone packaged Python service
        run: uv run python scripts/smoke-sidecar.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - run: corepack pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Install, exercise, and uninstall Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-installers.ps1
      - name: Verify service inside macOS application bundle
        if: runner.os == 'macOS'
        run: uv run python scripts/smoke-sidecar.py --binary src-tauri/target/release/bundle/macos/StyleDNA.app/Contents/MacOS/styledna-service
      - name: Install Debian package and verify its bundled service
        if: runner.os == 'Linux'
        run: |
          package=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          package_name=$(dpkg-deb -f "$package" Package)
          sudo apt-get install -y "./$package"
          uv run python scripts/smoke-sidecar.py --binary /usr/bin/styledna-service
          sudo apt-get remove -y "$package_name"
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/StyleDNA.app src-tauri/target/release/bundle/macos/StyleDNA.app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: StyleDNA-0.1.2-${{ runner.os }}-${{ runner.arch }}-unsigned
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.zip
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
      - name: Preserve Windows installation and UI evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Windows-installer-verification
          if-no-files-found: ignore
          path: |
            test-results/*.png
            test-results/install-*.log
